# Loads default set of integrations. Do not remove.
default_config:

lovelace:
  resource_mode: yaml
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Smart Home
      icon: mdi:view-dashboard
      show_in_sidebar: true

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# ─── LIGHT GROUPS (visible to Alexa as single devices) ───────────────────────
light:
  - platform: group
    name: "Living Room Lights"
    entities:
      - light.licht_wohnen
      - light.licht_essen
      - light.floor_lamp_2

  - platform: group
    name: "Kitchen Lights"
    entities:
      - light.licht_kuche
      - light.licht_kuche_steckdose

  - platform: group
    name: "Bedroom Lights"
    entities:
      - light.licht_schlafen

  - platform: group
    name: "Bathroom Lights"
    entities:
      - light.badezimmer

  - platform: group
    name: "Hallway Lights"
    entities:
      - light.licht_flur_eg
      - light.licht_treppe_eg_wand
      - light.licht_flur_og

  - platform: group
    name: "Basement Lights"
    entities:
      - light.licht_keller
      - light.licht_ug_flur
      - light.licht_hobby
      - light.licht_heizungsraum
      - light.licht_heizung
      - light.licht_treppe_wand

  - platform: group
    name: "Outside Lights"
    entities:
      - light.licht_hausture
      - light.licht_terrasse

template:
  - sensor:
      - name: "Last Doorbell Ring"
        unique_id: last_doorbell_ring
        icon: mdi:doorbell
        state: >
          {% set t = state_attr('automation.front_door_motion_push_notification', 'last_triggered') %}
          {% if t %}
            {{ t | as_timestamp | timestamp_custom('%-H:%M, %d.%m.%Y') }}
          {% else %}
            Never
          {% endif %}


cover:
  - platform: group
    name: "Living Room Blinds"
    entities:
      - cover.rollo_wohnen_1
      - cover.living_room_blind_2
      - cover.living_room_blind_3
      - cover.living_room_blind_5

  - platform: group
    name: "Kitchen Blinds"
    entities:
      - cover.living_room_blind_4
      - cover.blind_6

  - platform: group
    name: "Office Blinds"
    entities:
      - cover.office_blind
      - cover.blind_7
      - cover.blind_8

  - platform: group
    name: "Bedroom Blinds"
    entities:
      - cover.rollo_schlafen_1
      - cover.rollo_schlafen_2

input_boolean:
  kuche_motion_control:
    name: Küche Bewegungssteuerung
    icon: mdi:motion-sensor
    initial: true

  bad_motion_control:
    name: Bad Bewegungssteuerung
    icon: mdi:motion-sensor
    initial: true


# Loads default set of integrations. Do not remove.
default_config:

lovelace:
  resource_mode: yaml
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Smart Home
      icon: mdi:view-dashboard
      show_in_sidebar: true

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

shell_command:
  copy_wifi_qr: "mkdir -p /config/www && find /media /config/media -name 'wifi-qr.png' 2>/dev/null | head -1 | xargs -I{} cp {} /config/www/wifi-qr.png"

# ─── LIGHT GROUPS (visible to Alexa as single devices) ───────────────────────
light:
  - platform: group
    name: "Living Room Lights"
    entities:
      - light.licht_wohnen
      - light.licht_essen
      - light.floor_lamp_2

  - platform: group
    name: "Kitchen Lights"
    entities:
      - light.licht_kuche
      - light.licht_kuche_steckdose

  - platform: group
    name: "Bedroom Lights"
    entities:
      - light.licht_schlafen

  - platform: group
    name: "Bathroom Lights"
    entities:
      - light.badezimmer
      - light.hue_color_spot_1
      - light.hue_color_spot_2
      - light.hue_color_spot_3
      - light.hue_color_spot_4
      - light.hue_color_spot_5
      - light.hue_color_spot_6

  - platform: group
    name: "Hallway Lights"
    entities:
      - light.licht_flur_eg
      - light.licht_treppe_eg_wand
      - light.licht_flur_og

  - platform: group
    name: "Basement Lights"
    entities:
      - light.licht_keller
      - light.licht_ug_flur
      - light.licht_hobby
      - light.licht_heizungsraum
      - light.licht_heizung
      - light.licht_treppe_wand

  - platform: group
    name: "Outside Lights"
    entities:
      - light.licht_hausture
      - light.licht_terrasse

template:
  - sensor:
      - name: "Last Doorbell Ring"
        unique_id: last_doorbell_ring
        icon: mdi:doorbell
        state: >
          {% set t = state_attr('automation.front_door_motion_push_notification', 'last_triggered') %}
          {% if t %}
            {{ t | as_timestamp | timestamp_custom('%-H:%M, %d.%m.%Y') }}
          {% else %}
            Never
          {% endif %}

  - binary_sensor:
      - name: At home
        unique_id: house_at_home_indicator
        device_class: presence
        icon: mdi:home
        state: "{{ states('input_boolean.away_mode') == 'off' }}"


cover:
  # KNX: Living Room Blind 1–4 (2/2/30 … 2/2/120). Blind 4 is in Kitchen group (kitchen/living opening).
  # Group had rollo_wohnen_1 + 2,3,5 — Living Room Blind 1 (living_room_blind_1) was missing from Away/schedule.
  - platform: group
    name: "Living Room Blinds"
    entities:
      - cover.rollo_wohnen_1
      - cover.living_room_blind_1
      - cover.living_room_blind_2
      - cover.living_room_blind_3
      - cover.living_room_blind_5

  - platform: group
    name: "Kitchen Blinds"
    entities:
      - cover.living_room_blind_4
      - cover.blind_6

  - platform: group
    name: "Office Blinds"
    entities:
      - cover.office_blind
      - cover.blind_7
      - cover.blind_8

  - platform: group
    name: "Bedroom Blinds"
    entities:
      - cover.rollo_schlafen_1
      - cover.rollo_schlafen_2

input_boolean:
  kuche_motion_control:
    name: Küche Bewegungssteuerung
    icon: mdi:motion-sensor
    initial: true

  bad_motion_control:
    name: Bad Bewegungssteuerung
    icon: mdi:motion-sensor
    initial: true

  away_mode:
    name: Away mode
    icon: mdi:car-arrow-right
    initial: false

  vacation_mode:
    name: Vacation mode
    icon: mdi:palm-tree
    initial: false

# Sonos fetches this URL directly — use your HA LAN IP if mDNS (homeassistant.local) fails on speakers.
input_text:
  doorbell_chime_url:
    name: Doorbell chime URL
    max: 255
    initial: "http://homeassistant.local:8123/local/doorbell.mp3"
    mode: text

# Day setpoint stored per room for heating night setback (21:00 → -3°, 5:00 → restore)
input_number:
  living_room_day_setpoint:
    name: Living Room day setpoint
    min: 5
    max: 30
    step: 0.5
    initial: 21
    unit_of_measurement: "°C"
    mode: box
  office_day_setpoint:
    name: Office day setpoint
    min: 5
    max: 30
    step: 0.5
    initial: 21
    unit_of_measurement: "°C"
    mode: box
  bedroom_day_setpoint:
    name: Bedroom day setpoint
    min: 5
    max: 30
    step: 0.5
    initial: 21
    unit_of_measurement: "°C"
    mode: box
  room_day_setpoint:
    name: "Adnan's Room day setpoint"
    min: 5
    max: 30
    step: 0.5
    initial: 21
    unit_of_measurement: "°C"
    mode: box
  kids_room_day_setpoint:
    name: "Haaris' Room day setpoint"
    min: 5
    max: 30
    step: 0.5
    initial: 21
    unit_of_measurement: "°C"
    mode: box
  bathroom_day_setpoint:
    name: Bathroom day setpoint
    min: 5
    max: 30
    step: 0.5
    initial: 21
    unit_of_measurement: "°C"
    mode: box


# Loads default set of integrations. Do not remove.
default_config:

lovelace:
  resource_mode: yaml
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Smart Home
      icon: mdi:view-dashboard
      show_in_sidebar: true

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Front door camera — curl runs on the Pi (same LAN as intercom)
# Grabs one JPEG frame every 5 seconds from the MJPEG stream
camera:
  - platform: cmd_line
    name: "Front Door"
    command: "curl -s --max-time 4 http://192.168.136.99/video 2>/dev/null | head -c 200000"
    content_type: "image/jpeg"
    scan_interval: 5

template:
  - sensor:
      - name: "Last Doorbell Ring"
        unique_id: last_doorbell_ring
        icon: mdi:doorbell
        state: >
          {% set t = state_attr('automation.front_door_motion_push_notification', 'last_triggered') %}
          {% if t %}
            {{ t | as_timestamp | timestamp_custom('%-H:%M, %d.%m.%Y') }}
          {% else %}
            Never
          {% endif %}


cover:
  - platform: group
    name: "Living Room Blinds"
    entities:
      - cover.rollo_wohnen_1
      - cover.living_room_blind_2
      - cover.living_room_blind_3
      - cover.living_room_blind_5

  - platform: group
    name: "Kitchen Blinds"
    entities:
      - cover.living_room_blind_4
      - cover.blind_6

  - platform: group
    name: "Office Blinds"
    entities:
      - cover.office_blind
      - cover.blind_7
      - cover.blind_8

  - platform: group
    name: "Bedroom Blinds"
    entities:
      - cover.rollo_schlafen_1
      - cover.rollo_schlafen_2

input_boolean:

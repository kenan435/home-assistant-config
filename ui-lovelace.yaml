      - type: media-control
        entity: media_player.bathroom

      - type: tile
        entity: input_boolean.bad_motion_control
        name: Motion Control
        icon: mdi:motion-sensor

      - type: entities
        title: Blinds
        entities:
          - entity: cover.rollo_bad
            name: Bathroom Blind
          - entity: cover.rollo_wc
            name: WC Blind

  # ─── MEDIA ───────────────────────────────────────────────────────────────────
  - title: Media
    icon: mdi:music
    path: media

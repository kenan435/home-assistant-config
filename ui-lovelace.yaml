title: Smart Home
views:
  # ─── ÜBERSICHT ───────────────────────────────────────────────────────────────
  - title: Übersicht
    icon: mdi:home
    path: uebersicht
    cards:
      - type: glance
        title: Sensors & Security
        entities:
          - entity: binary_sensor.doorbell
            name: Motion EG
          - entity: binary_sensor.sensor_hausture
            name: Front Door

      - type: horizontal-stack
        cards:
          - type: tile
            entity: switch.garagentor
            name: Garage Door
            icon: mdi:garage
          - type: tile
            entity: switch.schalten_terrasse
            name: Terrace
            icon: mdi:patio-heater

      - type: entities
        title: All Blinds
        entities:
          - entity: cover.rollo_wohnen_1
            name: Living Room Blind 1
          - entity: cover.living_room_blind_2
            name: Living Room Blind 2
          - entity: cover.living_room_blind_3
            name: Living Room Blind 3
          - entity: cover.living_room_blind_5
            name: Living Room Blind 4
          - entity: cover.living_room_blind_4
            name: Kitchen Blind 1
          - entity: cover.blind_6
            name: Kitchen Blind 2
          - entity: cover.office_blind
            name: Office Blind
          - entity: cover.blind_7
            name: Office Blind 1
          - entity: cover.blind_8
            name: Office Blind 2
          - entity: cover.rollo_schlafen_1
            name: Bedroom Blind 1
          - entity: cover.rollo_schlafen_2
            name: Bedroom Blind 2
          - entity: cover.rollo_bad
            name: Bathroom Blind
          - entity: cover.rollo_kind
            name: Kids Room Blind
          - entity: cover.rollo_zimmer
            name: Room Blind
          - entity: cover.rollo_wc
            name: WC Blind

  # ─── LIVING ROOM ─────────────────────────────────────────────────────────────
  - title: Living Room
    icon: mdi:sofa
    path: living-room
    cards:
      - type: entities
        title: Lights
        entities:
          - entity: light.licht_wohnen
            name: Living Room
          - entity: light.licht_essen
            name: Dining Room
          - entity: light.hue_color_spot_1
            name: Spot 1
          - entity: light.hue_color_spot_2
            name: Spot 2
          - entity: light.hue_color_spot_3
            name: Spot 3
          - entity: light.hue_color_spot_4
            name: Spot 4
          - entity: light.hue_color_spot_5
            name: Spot 5
          - entity: light.hue_color_spot_6
            name: Spot 6

      - type: entities
        title: Blinds
        entities:
          - entity: cover.rollo_wohnen_1
            name: Living Room Blind 1
          - entity: cover.living_room_blind_2
            name: Living Room Blind 2
          - entity: cover.living_room_blind_3
            name: Living Room Blind 3
          - entity: cover.living_room_blind_5
            name: Living Room Blind 4

  # ─── KITCHEN ─────────────────────────────────────────────────────────────────
  - title: Kitchen
    icon: mdi:countertop
    path: kitchen
    cards:
      - type: entities
        title: Lights
        entities:
          - entity: light.licht_kuche
            name: Kitchen Ceiling
          - entity: light.licht_kuche_steckdose
            name: Kitchen Counter

      - type: tile
        entity: input_boolean.kuche_motion_control
        name: Motion Control
        icon: mdi:motion-sensor

      - type: entities
        title: Blinds
        entities:
          - entity: cover.living_room_blind_4
            name: Kitchen Blind 1
          - entity: cover.blind_6
            name: Kitchen Blind 2

  # ─── BEDROOM ─────────────────────────────────────────────────────────────────
  - title: Bedroom
    icon: mdi:bed
    path: bedroom
    cards:
      - type: entities
        title: Lights
        entities:
          - entity: light.licht_schlafen
            name: Bedroom

      - type: entities
        title: Blinds
        entities:
          - entity: cover.rollo_schlafen_1
            name: Bedroom Blind 1
          - entity: cover.rollo_schlafen_2
            name: Bedroom Blind 2

  # ─── OFFICE ──────────────────────────────────────────────────────────────────
  - title: Office
    icon: mdi:desk
    path: office
    cards:
      - type: entities
        title: Blinds
        entities:
          - entity: cover.office_blind
            name: Office Blind
          - entity: cover.blind_7
            name: Office Blind 1
          - entity: cover.blind_8
            name: Office Blind 2

  # ─── KIDS ROOM & ROOM ────────────────────────────────────────────────────────
  - title: Kids & Room
    icon: mdi:door
    path: kids-room
    cards:
      - type: entities
        title: Lights
        entities:
          - entity: light.licht_zimmer
            name: Room
          - entity: light.licht_kind
            name: Kids Room

      - type: entities
        title: Blinds
        entities:
          - entity: cover.rollo_zimmer
            name: Room Blind
          - entity: cover.rollo_kind
            name: Kids Room Blind

  # ─── OUTSIDE & HALLWAYS ──────────────────────────────────────────────────────
  - title: Outside
    icon: mdi:home-outline
    path: outside
    cards:
      - type: entities
        title: Lights
        entities:
          - entity: light.licht_hausture
            name: Front Door
          - entity: light.licht_terrasse
            name: Terrace
          - entity: light.licht_flur_eg
            name: Hallway EG
          - entity: light.licht_flur_og
            name: Hallway OG
          - entity: light.licht_ug_flur
            name: Hallway UG
          - entity: light.licht_treppe_wand
            name: Staircase Wall
          - entity: light.licht_treppe_eg_wand
            name: Staircase EG Wall

      - type: horizontal-stack
        cards:
          - type: tile
            entity: switch.garagentor
            name: Garage Door
            icon: mdi:garage
          - type: tile
            entity: switch.schalten_terrasse
            name: Terrace Switch
            icon: mdi:patio-heater

      - type: glance
        title: Sensors
        entities:
          - entity: binary_sensor.sensor_hausture
            name: Front Door

  # ─── BATHROOM & WC ───────────────────────────────────────────────────────────
  - title: Bathroom
    icon: mdi:shower
    path: bathroom
    cards:
      - type: entities
        title: Lights
        entities:
          - entity: light.licht_wc
            name: WC
          - entity: light.licht_wc_wand
            name: WC Wall
          - entity: light.badezimmer
            name: Bathroom

      - type: tile
        entity: input_boolean.bad_motion_control
        name: Motion Control
        icon: mdi:motion-sensor

      - type: entities
        title: Blinds
        entities:
          - entity: cover.rollo_bad
            name: Bathroom Blind
          - entity: cover.rollo_wc
            name: WC Blind

  # ─── BASEMENT & UTILITY ──────────────────────────────────────────────────────
  - title: Basement
    icon: mdi:stairs-down
    path: basement
    cards:
      - type: entities
        title: Lights
        entities:
          - entity: light.licht_keller
            name: Basement
          - entity: light.licht_ug_flur
            name: UG Hallway
          - entity: light.licht_hobby
            name: Hobby Room
          - entity: light.licht_heizungsraum
            name: Boiler Room
          - entity: light.licht_heizung
            name: Heating

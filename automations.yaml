# ─── KITCHEN COUNTER LIGHT - MOTION CONTROL ──────────────────────────────────
# Split into two automations so HA restarts don't leave the light stuck on.
# The OFF automation uses a `for:` duration trigger which is restart-safe.

- id: kitchen_counter_motion_on
  alias: "Kitchen Counter - Motion ON"
  description: "Turn on counter light when motion is detected and toggle is enabled"
  mode: single
  triggers:
    - platform: state
      entity_id: binary_sensor.hue_motion_sensor_1_motion
      to: "on"
  conditions:
    - condition: state
      entity_id: input_boolean.kuche_motion_control
      state: "on"
  actions:
    - action: light.turn_on
      target:
        entity_id: light.licht_kuche_steckdose

- id: kitchen_counter_motion_off
  alias: "Kitchen Counter - Motion OFF (5 min)"
  description: "Turn off counter light after 5 min of no motion. Restart-safe."
  mode: single
  triggers:
    - platform: state
      entity_id: binary_sensor.hue_motion_sensor_1_motion
      to: "off"
      for: "00:05:00"
  conditions:
    - condition: state
      entity_id: input_boolean.kuche_motion_control
      state: "on"
    - condition: state
      entity_id: light.licht_kuche_steckdose
      state: "on"
  actions:
    - action: light.turn_off
      target:
        entity_id: light.licht_kuche_steckdose

# ─── BASEMENT LIGHTS OFF AT 10 PM ────────────────────────────────────────────

- id: basement_lights_off_10pm
  alias: "Basement Lights Off at 10 PM"
  description: "Turn off all basement lights at 22:00 every day"
  mode: single
  triggers:
    - platform: time
      at: "22:00:00"
  conditions: []
  actions:
    - action: light.turn_off
      target:
        entity_id:
                  - light.basement_light
                  - light.basement_hallway_light
                  - light.hobby_room_light
                  - light.boiler_room_light
                  - light.heating_room_light
                  - light.basement_stairway_light

# ─── BLINDS EVENING (50% AT 20:00) ───────────────────────────────────────────
# Uses cover groups from configuration.yaml. HA: position 0 = closed, 100 = fully open → 50 = halfway.

- id: blinds_evening_living_kitchen_office_50
  alias: "Blinds - Living, Kitchen, Office to 50% at 8 PM"
  description: "Set main-area blinds to 50% position every night at 20:00."
  mode: single
  triggers:
    - platform: time
      at: "20:00:00"
  conditions:
    - condition: state
      entity_id: input_boolean.away_mode
      state: "off"
  actions:
    - action: cover.set_cover_position
      target:
        entity_id:
          - cover.living_room_blinds
          - cover.office_blinds
      data:
        position: 50

- id: blinds_morning_living_kitchen_office_open
  alias: "Blinds - Living, Kitchen, Office open at 6 AM"
  description: "Open main-area blinds every morning at 06:00."
  mode: single
  triggers:
    - platform: time
      at: "06:00:00"
  conditions:
    - condition: state
      entity_id: input_boolean.away_mode
      state: "off"
  actions:
    - action: cover.open_cover
      target:
        entity_id:
          - cover.living_room_blinds
          - cover.office_blinds

- id: blinds_night_living_office_closed
  alias: "Blinds - Living & Office fully closed at 10 PM"
  description: "Close living room and office blinds all the way at 22:00 (kitchen unchanged)."
  mode: single
  triggers:
    - platform: time
      at: "22:00:00"
  conditions:
    - condition: state
      entity_id: input_boolean.away_mode
      state: "off"
  actions:
    - action: cover.close_cover
      target:
        entity_id:
          - cover.living_room_blinds
          - cover.office_blinds

# ─── AWAY MODE — CLOSE ALL BLINDS ────────────────────────────────────────────
# Vacation mode: helper only for now (no automations). Add actions later when needed.

- id: away_mode_close_all_blinds
  alias: "Away mode - Close all blinds"
  description: "When Away mode is turned on, close every blind (groups + rooms not in groups)."
  mode: single
  triggers:
    - platform: state
      entity_id: input_boolean.away_mode
      from: "off"
      to: "on"
  conditions: []
  actions:
    - action: cover.close_cover
      target:
        entity_id:
          - cover.living_room_blinds
          - cover.office_blinds
          - cover.bedroom_blinds
          - cover.rollo_bad
          - cover.rollo_wc
          - cover.rollo_zimmer
          - cover.rollo_kind
          - cover.wc_blind

- id: away_mode_off_open_all_blinds
  alias: "Away off - Open all blinds (home)"
  description: "When Away mode is turned off, open every blind (same set as Away close). No separate 'home' toggle."
  mode: single
  triggers:
    - platform: state
      entity_id: input_boolean.away_mode
      from: "on"
      to: "off"
  conditions: []
  actions:
    - action: cover.open_cover
      target:
        entity_id:
          - cover.living_room_blinds
          - cover.office_blinds
          - cover.bedroom_blinds
          - cover.rollo_bad
          - cover.rollo_wc
          - cover.rollo_zimmer
          - cover.rollo_kind
          - cover.wc_blind

# ─── DOORBELL NOTIFICATION ───────────────────────────────────────────────────
# Triggered by: (1) KNX binary_sensor.doorbell, or (2) Loxone intercom UDP
# (scripts/loxone_doorbell_udp.py listens on port 8112 for command '50' and calls this automation via API).
# Actions: push to phone + doorbell chime on Kitchen + Living Room Sonos only.

- id: doorbell_notification
  alias: "Front Door Motion - Push Notification"
  description: "Notify when doorbell: push to phone + chime on kitchen/living Sonos."
  mode: single
  triggers:
    - platform: state
      entity_id: binary_sensor.doorbell
      to: "on"
  conditions: []
  actions:
    # Push to phone
    - action: notify.mobile_app_kenans_iphone
      data:
        title: "🔔 Front Door"
        message: "Someone is at the front door!"
        data:
          push:
            sound: default
          tag: doorbell

    # Chime on main Sonos only (Sonos pulls MP3 from URL — see Helpers → Doorbell chime URL).
    # Put doorbell.mp3 in /config/www/ (see www/README.md). announce: ducks music then resumes.
    - action: media_player.play_media
      target:
        entity_id:
          - media_player.living_room
          - media_player.kitchen
      data:
        media_content_id: "{{ states('input_text.doorbell_chime_url') }}"
        media_content_type: music
        announce: true

# ─── BLINK AUTO-ARM WHEN NOBODY HOME ────────────────────────────────────────
# Arms Blink when both Kenan and Almedina leave during the day.
# Blink's own schedule handles 21:00–06:00 — this covers the gaps.

- id: blink_arm_when_away
  alias: "Blink - Arm when everyone leaves"
  mode: single
  triggers:
    - platform: state
      entity_id:
        - person.kenan
        - person.almedina
      to: "not_home"
  conditions:
    - condition: state
      entity_id: person.kenan
      state: "not_home"
    - condition: state
      entity_id: person.almedina
      state: "not_home"
    - condition: state
      entity_id: alarm_control_panel.blink_home
      state: "disarmed"
  actions:
    - action: alarm_control_panel.alarm_arm_away
      target:
        entity_id: alarm_control_panel.blink_home

- id: blink_disarm_when_home
  alias: "Blink - Disarm when someone arrives"
  mode: single
  triggers:
    - platform: state
      entity_id:
        - person.kenan
        - person.almedina
      to: "home"
  conditions:
    - condition: state
      entity_id: alarm_control_panel.blink_home
      state: "armed_away"
  actions:
    - action: alarm_control_panel.alarm_disarm
      target:
        entity_id: alarm_control_panel.blink_home

# ─── BATHROOM LIGHTS - MOTION CONTROL ────────────────────────────────────────

- id: bathroom_motion_on
  alias: "Bathroom - Motion ON"
  description: "Turn on bathroom lights when motion is detected and toggle is enabled"
  mode: single
  triggers:
    - platform: state
      entity_id: binary_sensor.hue_motion_sensor_2_motion
      to: "on"
  conditions:
    - condition: state
      entity_id: input_boolean.bad_motion_control
      state: "on"
  actions:
    - action: light.turn_on
      target:
        entity_id: light.badezimmer

- id: bathroom_motion_off
  alias: "Bathroom - Motion OFF (10 min)"
  description: "Turn off bathroom lights after 10 min of no motion. Restart-safe."
  mode: single
  triggers:
    - platform: state
      entity_id: binary_sensor.hue_motion_sensor_2_motion
      to: "off"
      for: "00:10:00"
  conditions:
    - condition: state
      entity_id: input_boolean.bad_motion_control
      state: "on"
    - condition: state
      entity_id: light.badezimmer
      state: "on"
  actions:
    - action: light.turn_off
      target:
        entity_id: light.badezimmer

# ─── HEATING NIGHT SETBACK (21:00–5:00) ───────────────────────────────────────
# At 21:00: save each room’s current setpoint (daytime) to input_number, then set all zones to 16°C overnight.
# At 5:00: restore each room to the saved daytime setpoint. Delays between KNX writes.

- id: heating_night_setback_21
  alias: "Heating - Night setpoint at 21:00 (16°C)"
  description: "Capture daytime setpoint per room, then set all heating to 16°C overnight"
  mode: single
  triggers:
    - platform: time
      at: "21:00:00"
  conditions: []
  actions:
    # Living Room: save daytime setpoint, then night 16°C
    - action: input_number.set_value
      target:
        entity_id: input_number.living_room_day_setpoint
      data:
        value: "{{ (state_attr('climate.living_room_heating', 'target_temperature') or 21) | float }}"
    - delay:
        seconds: 1
    - action: climate.set_temperature
      target:
        entity_id: climate.living_room_heating
      data:
        temperature: 16
    - delay:
        seconds: 1
    # Office
    - action: input_number.set_value
      target:
        entity_id: input_number.office_day_setpoint
      data:
        value: "{{ (state_attr('climate.office_heating', 'target_temperature') or 21) | float }}"
    - delay:
        seconds: 1
    - action: climate.set_temperature
      target:
        entity_id: climate.office_heating
      data:
        temperature: 16
    - delay:
        seconds: 1
    # Bedroom
    - action: input_number.set_value
      target:
        entity_id: input_number.bedroom_day_setpoint
      data:
        value: "{{ (state_attr('climate.bedroom_heating', 'target_temperature') or 21) | float }}"
    - delay:
        seconds: 1
    - action: climate.set_temperature
      target:
        entity_id: climate.bedroom_heating
      data:
        temperature: 16
    - delay:
        seconds: 1
    # Adnan's Room
    - action: input_number.set_value
      target:
        entity_id: input_number.room_day_setpoint
      data:
        value: "{{ (state_attr('climate.room_heating', 'target_temperature') or 21) | float }}"
    - delay:
        seconds: 1
    - action: climate.set_temperature
      target:
        entity_id: climate.room_heating
      data:
        temperature: 16
    - delay:
        seconds: 1
    # Haaris' Room
    - action: input_number.set_value
      target:
        entity_id: input_number.kids_room_day_setpoint
      data:
        value: "{{ (state_attr('climate.kids_room_heating', 'target_temperature') or 21) | float }}"
    - delay:
        seconds: 1
    - action: climate.set_temperature
      target:
        entity_id: climate.kids_room_heating
      data:
        temperature: 16
    - delay:
        seconds: 1
    # Bathroom
    - action: input_number.set_value
      target:
        entity_id: input_number.bathroom_day_setpoint
      data:
        value: "{{ (state_attr('climate.bathroom_heating', 'target_temperature') or 21) | float }}"
    - delay:
        seconds: 1
    - action: climate.set_temperature
      target:
        entity_id: climate.bathroom_heating
      data:
        temperature: 16

- id: heating_day_restore_05
  alias: "Heating - Restore day setpoint at 5:00"
  description: "Restore each room to its saved day setpoint"
  mode: single
  triggers:
    - platform: time
      at: "05:00:00"
  conditions: []
  actions:
    - action: climate.set_temperature
      target:
        entity_id: climate.living_room_heating
      data:
        temperature: "{{ states('input_number.living_room_day_setpoint') | float }}"
    - action: climate.set_temperature
      target:
        entity_id: climate.office_heating
      data:
        temperature: "{{ states('input_number.office_day_setpoint') | float }}"
    - action: climate.set_temperature
      target:
        entity_id: climate.bedroom_heating
      data:
        temperature: "{{ states('input_number.bedroom_day_setpoint') | float }}"
    - action: climate.set_temperature
      target:
        entity_id: climate.room_heating
      data:
        temperature: "{{ states('input_number.room_day_setpoint') | float }}"
    - action: climate.set_temperature
      target:
        entity_id: climate.kids_room_heating
      data:
        temperature: "{{ states('input_number.kids_room_day_setpoint') | float }}"
    - action: climate.set_temperature
      target:
        entity_id: climate.bathroom_heating
      data:
        temperature: "{{ states('input_number.bathroom_day_setpoint') | float }}"

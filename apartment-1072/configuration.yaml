# ─── APARTMENT 1072 — HOME ASSISTANT CONFIGURATION ───────────────────────────
# KNX group addresses from ETS5 project file (Isaria WA10c, 01.10.2025).
# All addresses in the 11/4/x and 11/5/x ranges.
# KNX gateway IP: set in secrets.yaml (find with: nmap -p 3671 <subnet>)

default_config:

frontend:
  themes: !include_dir_merge_named themes

lovelace:
  resource_mode: yaml
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Apartment 1072
      icon: mdi:home
      show_in_sidebar: true


automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# ─── KNX ─────────────────────────────────────────────────────────────────────
# NOTE: KNX connection (IP gateway host/port) is configured via the UI:
# Settings → Devices & Services → KNX → Configure
# The KNX gateway IP for this apartment: find with `nmap -p 3671 <subnet>`
knx:
  binary_sensor:
    - name: "Doorbell"
      state_address: "11/4/10"
      device_class: sound

  light:
    - name: "Hallway Light"
      address: "11/4/12"
      state_address: "11/4/13"
    - name: "WC Ceiling Light"
      address: "11/4/14"
      state_address: "11/4/15"
    - name: "WC Wall Light"
      address: "11/4/16"
      state_address: "11/4/17"
    - name: "Bathroom Ceiling Light"
      address: "11/4/18"
      state_address: "11/4/19"
    - name: "Bathroom Wall Light"
      address: "11/4/20"
      state_address: "11/4/21"
    - name: "Kitchen Ceiling Light"
      address: "11/4/22"
      state_address: "11/4/23"
    - name: "Bedroom Ceiling Light"
      address: "11/4/24"
      state_address: "11/4/25"
    - name: "Kids Room Ceiling Light"
      address: "11/4/26"
      state_address: "11/4/27"
    - name: "Living Room Ceiling Light"
      address: "11/4/28"
      state_address: "11/4/29"
    - name: "Dining Room Ceiling Light"
      address: "11/4/30"
      state_address: "11/4/31"
    - name: "Kitchen Cabinet Light"
      address: "11/4/32"
      state_address: "11/4/33"
    - name: "Terrace Wall Light"
      address: "11/4/38"
      state_address: "11/4/39"

  switch:
    - name: "Kitchen Fan"
      address: "11/4/34"
      state_address: "11/4/35"
    - name: "Terrace Socket"
      address: "11/4/36"
      state_address: "11/4/37"
    - name: "Bedroom Bed Sockets"
      address: "11/4/42"
    - name: "Bathroom Heater"
      address: "11/4/49"
      state_address: "11/4/50"

  cover:
    # Living / Dining blinds (3 individual + group)
    - name: "Balcony Blind"
      move_long_address: "11/4/205"
      stop_address: "11/4/206"
      position_state_address: "11/4/208"
      position_address: "11/4/207"
    - name: "Living Room Blind 2"
      move_long_address: "11/4/212"
      stop_address: "11/4/213"
      position_state_address: "11/4/215"
      position_address: "11/4/214"
    - name: "Living Room Blind 3"
      move_long_address: "11/4/219"
      stop_address: "11/4/220"
      position_state_address: "11/4/222"
      position_address: "11/4/221"
    # Bedroom blinds (2 individual + group)
    - name: "Bedroom Blind 1"
      move_long_address: "11/4/177"
      stop_address: "11/4/178"
      position_state_address: "11/4/180"
      position_address: "11/4/179"
    - name: "Bedroom Blind 2"
      move_long_address: "11/4/184"
      stop_address: "11/4/185"
      position_state_address: "11/4/187"
      position_address: "11/4/186"
    # Other rooms
    - name: "Kitchen Blind"
      move_long_address: "11/4/198"
      stop_address: "11/4/199"
      position_state_address: "11/4/201"
      position_address: "11/4/200"
    - name: "Kids Room Blind"
      move_long_address: "11/4/170"
      stop_address: "11/4/171"
      position_state_address: "11/4/173"
      position_address: "11/4/172"
    - name: "Bathroom Blind"
      move_long_address: "11/4/191"
      stop_address: "11/4/192"
      position_state_address: "11/4/194"
      position_address: "11/4/193"

  climate:
    # Living/Dining/Kitchen is one combined zone
    - name: "Living Room Heating"
      temperature_address: "11/4/70"
      target_temperature_address: "11/4/71"
      target_temperature_state_address: "11/4/73"
      operation_mode_state_address: "11/4/74"
      min_temp: 5
      max_temp: 30
    - name: "WC Heating"
      temperature_address: "11/4/81"
      target_temperature_address: "11/4/82"
      target_temperature_state_address: "11/4/84"
      operation_mode_state_address: "11/4/85"
      min_temp: 5
      max_temp: 30
    - name: "Kids Room Heating"
      temperature_address: "11/4/92"
      target_temperature_address: "11/4/93"
      target_temperature_state_address: "11/4/95"
      operation_mode_state_address: "11/4/96"
      min_temp: 5
      max_temp: 30
    - name: "Bedroom Heating"
      temperature_address: "11/4/103"
      target_temperature_address: "11/4/104"
      target_temperature_state_address: "11/4/106"
      operation_mode_state_address: "11/4/107"
      min_temp: 5
      max_temp: 30
    - name: "Bathroom Heating"
      temperature_address: "11/4/114"
      target_temperature_address: "11/4/115"
      target_temperature_state_address: "11/4/117"
      operation_mode_state_address: "11/4/118"
      min_temp: 5
      max_temp: 30

# ─── COVER GROUPS ─────────────────────────────────────────────────────────────
cover:
  - platform: group
    name: "Living Room Blinds"
    entities:
      - cover.living_room_blind_2
      - cover.living_room_blind_3

  - platform: group
    name: "Bedroom Blinds"
    entities:
      - cover.bedroom_blind_1
      - cover.bedroom_blind_2

# ─── INPUT BOOLEANS ───────────────────────────────────────────────────────────
input_boolean:
  away_mode:
    name: Away mode
    icon: mdi:car-arrow-right
    initial: false

  vacation_mode:
    name: Vacation mode
    icon: mdi:palm-tree
    initial: false

# ─── INPUT NUMBERS (heating night setback) ────────────────────────────────────
input_number:
  living_room_day_setpoint:
    name: Living Room day setpoint
    min: 5
    max: 30
    step: 0.5
    initial: 21
    unit_of_measurement: "°C"
    mode: box
  bedroom_day_setpoint:
    name: Bedroom day setpoint
    min: 5
    max: 30
    step: 0.5
    initial: 21
    unit_of_measurement: "°C"
    mode: box
  kids_room_day_setpoint:
    name: Kids Room day setpoint
    min: 5
    max: 30
    step: 0.5
    initial: 21
    unit_of_measurement: "°C"
    mode: box
  bathroom_day_setpoint:
    name: Bathroom day setpoint
    min: 5
    max: 30
    step: 0.5
    initial: 21
    unit_of_measurement: "°C"
    mode: box

# ─── TEMPLATE SENSORS ─────────────────────────────────────────────────────────
template:
  - sensor:
      - name: "Last Doorbell Ring"
        unique_id: last_doorbell_ring_1072
        icon: mdi:doorbell
        state: >
          {% set t = state_attr('automation.doorbell_notification', 'last_triggered') %}
          {% if t %}
            {{ t | as_timestamp | timestamp_custom('%-H:%M, %d.%m.%Y') }}
          {% else %}
            Never
          {% endif %}

  - binary_sensor:
      - name: At home
        unique_id: house_at_home_1072
        device_class: presence
        icon: mdi:home
        state: "{{ states('input_boolean.away_mode') == 'off' }}"
